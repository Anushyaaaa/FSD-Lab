    // ==========================================

    function Toast({ toast, onClose }) {
      if (!toast.visible) return null;
      const isSuccess = toast.type === "success";
      return (
        <div className="fixed bottom-6 right-6 z-50 animate-fade-in max-w-md">
          <div className={`flex items-start gap-3 p-4 rounded-2xl shadow-2xl border text-white ${
            isSuccess ? "bg-slate-900 border-emerald-500/50" : "bg-red-950 border-red-500/50"
          }`}>
            <span className={`flex-shrink-0 w-8 h-8 rounded-xl flex items-center justify-center text-sm font-bold ${
              isSuccess ? "bg-emerald-500/20 text-emerald-400" : "bg-red-500/20 text-red-400"
            }`}>
              <i className={`fa-solid ${isSuccess ? "fa-check" : "fa-triangle-exclamation"}`}></i>
            </span>
            <div className="flex-1 pr-2">

    // ==========================================

    // ==========================================
    function StatsBar({ events }) {
      const stats = useMemo(() => {
        const total = events.length;
        const attendees = events.reduce((sum, ev) => sum + (Number(ev.registered) || 0), 0);
        const categories = new Set(events.map(ev => ev.category)).size;
        const totalCap = events.reduce((sum, ev) => sum + (Number(ev.capacity) || 0), 0);
        return { total, attendees, categories, totalCap };
      }, [events]);

      return (
        <section className="mb-8">
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            
            <div className="p-5 rounded-2xl bg-white border border-slate-200/90 shadow-sm flex items-center justify-between">

    // ==========================================

    function EventCard({ event, onEdit, onDelete, onIssuePass }) {

      const isVip = event.accessLevel.includes("VIP");

      const categoryColors = {
        Technical: "bg-blue-50 text-brand-700 border-blue-200",
        Cultural: "bg-rose-50 text-accent-rose border-rose-200",
        Sports: "bg-emerald-50 text-accent-emerald border-emerald-200",
        Management: "bg-amber-50 text-amber-700 border-amber-200",

      return (
        <div className="bg-white rounded-3xl border border-slate-200/90 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col overflow-hidden group">
          
          {/* Card Image Banner */}
          <div className="relative aspect-[16/9] w-full bg-slate-100 overflow-hidden">
            <img
              src={event.image}
              alt={event.title}
              onError={(e) => { e.target.src = "https://images.unsplash.com/photo-1511578314322-379afb476865?auto=format&fit=crop&w=800&q=80"; }}

            />
            <div className="absolute inset-0 bg-gradient-to-t from-slate-950/70 via-transparent to-transparent"></div>
            
            {/* Top Badges */}
            <div className="absolute top-3 left-3 right-3 flex items-center justify-between">
              <span className={`px-2.5 py-1 rounded-lg text-[10px] font-mono font-bold tracking-wider uppercase border backdrop-blur-md bg-white/90 shadow-sm ${
                categoryColors[event.category] || "bg-slate-100 text-slate-700"
              }`}>
                {event.category}
              </span>

              <span className={`px-2 py-0.5 rounded-md text-[10px] font-bold font-mono tracking-wide ${
                isHybrid ? "bg-purple-600 text-white" : "bg-emerald-600 text-white"
              }`}>
                <i className={`fa-solid ${isHybrid ? "fa-video" : "fa-building"} mr-1 text-[9px]`}></i>
                {event.mode}
              </span>
            </div>

            {/* Bottom Organizer Tag */}
            <div className="absolute bottom-2.5 left-3 right-3">
              <span className="text-[11px] font-medium text-white/90 truncate block">
                <i className="fa-solid fa-users text-[10px] mr-1 text-blue-300"></i>
                {event.organizer}
              </span>
            </div>
          </div>

          {/* Card Body */}
          <div className="p-5 flex-1 flex flex-col justify-between">
            <div>
              <div className="flex items-center gap-2 mb-1.5">
                <span className={`px-2 py-0.5 rounded text-[10px] font-semibold ${
                  isVip ? "bg-amber-100 text-amber-800 border border-amber-300" : "bg-slate-100 text-slate-600"
                }`}>
                  <i className={`fa-solid ${isVip ? "fa-crown" : "fa-ticket"} text-[9px] mr-1 text-amber-600`}></i>
                  {event.accessLevel}
                </span>
                <span className="text-[11px] text-slate-400 font-mono">ID: {event.id}</span>
              </div>

              <h3 className="font-sans font-bold text-base text-slate-900 group-hover:text-brand-600 transition-colors leading-snug">
                {event.title}
              </h3>

              <p className="text-xs text-slate-500 mt-2 line-clamp-2 leading-relaxed">
                {event.description}
              </p>

              {/* Logistics Metadata */}
              <div className="mt-4 pt-3 border-t border-slate-100 space-y-1.5 text-xs text-slate-600 font-medium">
                <div className="flex items-center gap-2">
                  <i className="fa-regular fa-calendar text-brand-600 w-4 text-center"></i>
                  <span>{event.date} • {event.time}</span>
                </div>
                <div className="flex items-center gap-2 truncate">
                  <i className="fa-solid fa-location-dot text-rose-500 w-4 text-center"></i>
                  <span className="truncate">{event.venue}</span>
                </div>
              </div>

              {/* Capacity Progress Bar */}
              <div className="mt-4">
                <div className="flex items-center justify-between text-[11px] font-mono text-slate-500 mb-1">
                  <span>RSVP Fill Rate:</span>
                  <span className="font-bold text-slate-800">{event.registered} / {event.capacity} ({pct}%)</span>
                </div>
                <div className="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                  <div
                    className={`h-full rounded-full transition-all duration-500 ${
                      pct > 80 ? "bg-accent-rose" : "bg-brand-600"
                    }`}
                    style={{ width: `${pct}%` }}
                  ></div>
                </div>
              </div>
            </div>

            {/* Action Buttons (CRUD Triggers) */}
            <div className="mt-5 pt-4 border-t border-slate-100 flex items-center justify-between gap-2">
              <button
                onClick={() => onIssuePass(event)}
                className="flex-1 py-2 px-3 rounded-xl bg-blue-50 hover:bg-blue-100 text-brand-700 text-xs font-bold transition-all text-center"
              >
                <i className="fa-solid fa-qrcode mr-1.5"></i>
                <span>Get Pass</span>
              </button>

              <div className="flex items-center gap-1.5">
                <button
                  onClick={() => onEdit(event)}
                  title="Update this event record"
                  className="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center text-xs transition-all"
                >
                  <i className="fa-solid fa-pen-to-square"></i>
                </button>
                <button
                  onClick={() => onDelete(event)}
                  title="Delete this event record"
                  className="w-8 h-8 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 flex items-center justify-center text-xs transition-all"
                >
                  <i className="fa-solid fa-trash-can"></i>
                </button>
              </div>
            </div>

          </div>

        </div>
      );
    }

    // ==========================================
    // COMPONENT: Event Form Modal (CREATE & UPDATE)
    // Multiple input fields, Radio Buttons, Select Dropdown
    // ==========================================
    function EventFormModal({ isOpen, onClose, onSubmit, editingEvent, createDraft }) {
      if (!isOpen) return null;

      const isEdit = Boolean(editingEvent);

      const [formData, setFormData] = useState({
        title: editingEvent ? editingEvent.title : (createDraft ? createDraft.title : ""),
        category: editingEvent ? editingEvent.category : (createDraft ? createDraft.category : "Technical"),
        date: editingEvent ? editingEvent.date : (createDraft ? createDraft.date : "2026-04-10"),
        time: editingEvent ? editingEvent.time : (createDraft ? createDraft.time : "10:00 AM"),
        venue: editingEvent ? editingEvent.venue : (createDraft ? createDraft.venue : ""),
        organizer: editingEvent ? editingEvent.organizer : (createDraft ? createDraft.organizer : ""),
        capacity: editingEvent ? editingEvent.capacity : (createDraft ? createDraft.capacity : 300),
        registered: editingEvent ? editingEvent.registered : 0,

    // ==========================================
    // MAIN APP COMPONENT
    // State Management: useState & useEffect
    // ==========================================
    function App() {
      // 1. Events State with LocalStorage Persistence
      const [events, setEvents] = useState(() => {
        try {
          const saved = localStorage.getItem("campusvibe_events_react");
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {
          console.error("LocalStorage load error:", e);
        }
        return INITIAL_EVENTS;
      });

      // 2. Filter & Search State
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("All");
      const [modeFilter, setModeFilter] = useState("All");

      // 3. Modals State
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [editingEvent, setEditingEvent] = useState(null);
      const [createDraft, setCreateDraft] = useState(null);
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [passTarget, setPassTarget] = useState(null);

      // 4. Toast Notification State
      const [toast, setToast] = useState({ visible: false, title: "", message: "", type: "success" });

      const showToast = (title, message, type = "success") => {
        setToast({ visible: true, title, message, type });
        setTimeout(() => setToast(prev => ({ ...prev, visible: false })), 4000);
      };

      // Sync state to LocalStorage upon every mutation
      useEffect(() => {
        try {
          localStorage.setItem("campusvibe_events_react", JSON.stringify(events));
        } catch (e) {
          console.error("LocalStorage save error:", e);
        }
      }, [events]);

      // Hash-based state initializers for automated testing & lab demonstration
      useEffect(() => {
        const hash = window.location.hash;
        if (hash === "#create") {
          setEditingEvent(null);
          setCreateDraft({
            title: "National AI & Robotics Symposium 2026",
            category: "Technical",
            date: "2026-05-15",
            time: "09:30 AM",
            venue: "Kengeri Campus Auditorium IV",
            organizer: "Robotics Club & Dept of ECE",
            capacity: 350,
            registered: 0,
            mode: "In-Person",
            accessLevel: "Standard Student Entry",
            description: "Inter-collegiate robotics and autonomous systems competition with live drone racing and hardware exhibits.",
            image: "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&w=800&q=80"
          });
          setIsFormOpen(true);
        } else if (hash === "#update") {
          const target = events.find(e => e.id === "ev-101") || events[0];
          setEditingEvent(target);
          setIsFormOpen(true);
        } else if (hash === "#delete") {
          const target = events.find(e => e.id === "ev-102") || events[1];
          setDeleteTarget(target);
        } else if (hash === "#search") {
          setSearchQuery("Hack");
        }
      }, []);

      // Global keyboard shortcut: ⌘K or Ctrl+K focuses search
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === "k") {
            e.preventDefault();
            const searchInput = document.querySelector("header input[type='text']");
            if (searchInput) searchInput.focus();
          }
          if (e.key === "Escape") {
            setIsFormOpen(false);
            setDeleteTarget(null);
            setPassTarget(null);
          }
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, []);

      // Filtered Events (Bonus Search & Filter Requirement)
      const filteredEvents = useMemo(() => {
        return events.filter(ev => {
          const matchesCat = selectedCategory === "All" || ev.category === selectedCategory;
          const matchesMode = modeFilter === "All" || ev.mode === modeFilter;
          const q = searchQuery.toLowerCase().trim();
          const matchesSearch = !q || 
            ev.title.toLowerCase().includes(q) ||
            ev.venue.toLowerCase().includes(q) ||
            ev.organizer.toLowerCase().includes(q) ||
            ev.category.toLowerCase().includes(q);
          return matchesCat && matchesMode && matchesSearch;
        });
      }, [events, selectedCategory, modeFilter, searchQuery]);

      // --- CRUD HANDLERS ---

      // 1. CREATE or UPDATE
      const handleSaveEvent = (formData) => {
        if (editingEvent) {
          // UPDATE
          setEvents(prev => prev.map(ev => ev.id === editingEvent.id ? { ...ev, ...formData } : ev));
          showToast("Record Updated (UPDATE)", `"${formData.title}" was successfully updated in database.`);
        } else {
          // CREATE
          const newId = `ev-${Date.now().toString().slice(-4)}`;
          const newEvent = {
            id: newId,
            ...formData,
            registered: 0,
            status: "Active"
          };
          setEvents(prev => [newEvent, ...prev]);
          showToast("Event Created (CREATE)", `"${formData.title}" added to campus database.`);
        }
        setIsFormOpen(false);
        setEditingEvent(null);
      };

      // 2. DELETE
      const handleConfirmDelete = (id) => {
        const target = events.find(ev => ev.id === id);
        setEvents(prev => prev.filter(ev => ev.id !== id));
        setDeleteTarget(null);
        showToast("Record Deleted (DELETE)", `"${target ? target.title : id}" was removed from database.`, "error");
      };

      // 3. RESET DATABASE DEFAULTS
      const handleResetData = () => {
        setEvents(INITIAL_EVENTS);
        localStorage.setItem("campusvibe_events_react", JSON.stringify(INITIAL_EVENTS));
        showToast("Database Reset", "Re-seeded initial 6 events from db.json.");
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Navigation Bar */}
          <Navbar
            searchQuery={searchQuery}
            setSearchQuery={setSearchQuery}
            onOpenCreate={() => { setEditingEvent(null); setIsFormOpen(true); }}
            onResetData={handleResetData}
            eventCount={events.length}
          />

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-28 pb-20 w-full">
            
            {/* Page Header */}
            <div className="mb-8">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-50 border border-blue-200/60 text-xs font-bold text-brand-700 mb-2">
                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>Christ University Bangalore • FSD Lab Exercise 5 & 6</span>
                  </div>
                  <h1 className="font-sans text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
                    Event & Club Management Portal
                  </h1>
                  <p className="text-sm text-slate-500 mt-1 max-w-2xl">
                    Demonstrating functional React components, useState hooks, controlled forms, multiple inputs, radio buttons, select dropdowns, and full CRUD operations.
                  </p>
                </div>

                {/* Quick Add Button */}
                <div className="flex items-center gap-3">
                  <button
                    onClick={() => { setEditingEvent(null); setIsFormOpen(true); }}
                    className="inline-flex items-center gap-2 px-5 py-3 rounded-2xl font-bold text-sm text-white bg-brand-600 hover:bg-brand-700 shadow-xl shadow-brand-500/25 transition-all"
                  >
                    <i className="fa-solid fa-circle-plus"></i>
                    <span>Register New Event</span>
                  </button>
                </div>
              </div>
            </div>

            {/* Real-Time Computed Stats Bar */}
            <StatsBar events={events} />

            {/* Filter Bar with Select and Categories */}
            <FilterBar
              selectedCategory={selectedCategory}
              setSelectedCategory={setSelectedCategory}
              modeFilter={modeFilter}
              setModeFilter={setModeFilter}
              visibleCount={filteredEvents.length}
              totalCount={events.length}
            />

            {/* Dynamic Event Grid (READ Operation) */}
            {filteredEvents.length > 0 ? (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {filteredEvents.map(event => (
                  <EventCard
                    key={event.id}
                    event={event}
                    onEdit={(ev) => { setEditingEvent(ev); setIsFormOpen(true); }}
                    onDelete={(ev) => setDeleteTarget(ev)}
                    onIssuePass={(ev) => setPassTarget(ev)}
                  />
                ))}
              </div>
            ) : (
              <div className="p-12 text-center bg-white rounded-3xl border border-dashed border-slate-300">
                <div className="w-16 h-16 rounded-2xl bg-slate-100 text-slate-400 mx-auto flex items-center justify-center text-2xl mb-3">
                  <i className="fa-solid fa-magnifying-glass"></i>
                </div>
                <h3 className="font-sans font-bold text-base text-slate-800">No Events Found</h3>
                <p className="text-xs text-slate-500 mt-1 max-w-sm mx-auto">
                  No event records match your active query "{searchQuery}" or category filter "{selectedCategory}".
                </p>
                <button
                  onClick={() => { setSearchQuery(""); setSelectedCategory("All"); setModeFilter("All"); }}
                  className="mt-4 px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-all"
                >
                  Clear Filters
                </button>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3 font-sans">
              <div>
                <strong>CampusVibe</strong> • Department of Computer Science & Engineering, Christ University
              </div>
              <div className="font-mono text-[11px]">
                Student: <span className="font-bold text-slate-800">Anushya C.</span> (Reg No: <span className="font-bold text-brand-700">2648508</span>)
              </div>
            </div>
          </footer>

          {/* Modals */}
          <EventFormModal
            isOpen={isFormOpen}
            editingEvent={editingEvent}
            createDraft={createDraft}
            onClose={() => { setIsFormOpen(false); setEditingEvent(null); setCreateDraft(null); }}
            onSubmit={handleSaveEvent}
          />

          <DeleteConfirmModal
            target={deleteTarget}
            onClose={() => setDeleteTarget(null)}
            onConfirm={handleConfirmDelete}
          />

          <PassModal
            event={passTarget}
            onClose={() => setPassTarget(null)}
          />

          <Toast
            toast={toast}
            onClose={() => setToast(prev => ({ ...prev, visible: false }))}
          />

        </div>
      );
    }

    // Render the React 18 Application
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
